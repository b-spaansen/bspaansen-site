name: Voorraad synchroniseren

on:
  schedule:
    - cron: '*/10 * * * *'   # elke 10 minuten
  workflow_dispatch:          # handmatig starten kan ook

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Haal Google Sheet op
        env:
          SHEET_CSV_URL: ${{ vars.SHEET_CSV_URL || 'https://docs.google.com/spreadsheets/d/1F2xApLBPTyLJ2J7L5RdmoIfpnKQuapcxxpC4HLqzEhg/export?format=csv' }}
        run: |
          if [ -z "$SHEET_CSV_URL" ]; then echo "SHEET_CSV_URL niet ingesteld"; exit 0; fi
          curl -fsSL "$SHEET_CSV_URL" -o nieuw.csv
          # alleen doorgaan als het echt de voorraadlijst is (kopregel met Merk en Type)
          head -1 nieuw.csv | tr 'A-Z' 'a-z' | grep -q 'merk' && head -1 nieuw.csv | tr 'A-Z' 'a-z' | grep -q 'type' || { echo "Geen geldige voorraadlijst"; exit 1; }
          mv nieuw.csv voorraad.csv
      - name: Opslaan als er iets veranderd is
        run: |
          git config user.name "voorraad-bot"
          git config user.email "voorraad-bot@users.noreply.github.com"
          git add voorraad.csv
          git diff --cached --quiet && echo "Geen wijzigingen" && exit 0
          git commit -m "Voorraad bijgewerkt vanuit Google Sheet"
          git push
